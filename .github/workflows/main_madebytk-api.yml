# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - madebytk-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11' # set this to the python version to use (supports 3.6, 3.7, 3.8)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Dependencies go inside the package: the deploy below does no remote build.
      - name: Install dependencies into the app package
        run: pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      # Optional: Add step to run tests here

      # Zip everything including dotfiles (.env.config, .python_packages).
      - name: Zip artifact for deployment
        run: >
          zip -r release.zip .
          -x ".git/*" ".github/*" ".claude/*" "website/*" "docs/*" "venv/*"
          "*/__pycache__/*" "Dockerfile" "docker-compose.yml" "nginx.conf"
          ".dockerignore" ".env.secret"

      - name: Verify package contents
        run: |
          for f in function_app.py host.json .env.config .python_packages/lib/site-packages/fastapi/__init__.py; do
            unzip -l release.zip | grep -q " $f$" || { echo "missing from package: $f"; exit 1; }
          done

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EE26F429B68D4753A11415E600C4A364 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_22514725EA3B4BE4BE3954F36ED5F16C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_18FFC8F3996343FCB6015D2F358E2376 }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'madebytk-api'
          slot-name: 'Production'
          package: release.zip
          